  <meta property="og:description" content="Bloco de notas online grátis com abas, preview de Markdown, PDF e sincronização com o Google Drive.">

  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">

  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Notepad","url":"https://rodrigo.pro/notepad/","description":"Editor de texto online com várias abas, localizar e substituir, preview de Markdown, impressão em PDF e sincronização com o Google Drive.","applicationCategory":"UtilitiesApplication","operatingSystem":"Qualquer navegador moderno","inLanguage":"pt-BR","browserRequirements":"Requer JavaScript","offers":{"@type":"Offer","price":"0","priceCurrency":"BRL"},"featureList":["Várias abas","Localizar e substituir","Preview de Markdown","Imprimir ou salvar em PDF","Sincronização com o Google Drive"]}</script>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/print.css" media="print">
</head>
<body>
  <header id="toolbar" role="toolbar" aria-label="Ações">
    <h1 class="brand">Notepad</h1>
    <button type="button" data-action="new" title="Nova aba (Ctrl+Alt+N)">Novo</button>
    <button type="button" data-action="open-drive" title="Abrir do Drive">Abrir</button>
    <button type="button" data-action="save-drive" title="Salvar no Drive (Ctrl+S)">Salvar</button>
    <span class="sep"></span>
    <button type="button" data-action="find" title="Localizar / substituir (Ctrl+F)">Localizar</button>
    <button type="button" data-action="goto" title="Ir para linha (Ctrl+G)">Ir p/ linha</button>
    <span class="sep"></span>
    <button type="button" data-action="preview" aria-pressed="false" title="Preview de Markdown (Ctrl+Alt+M)">Preview</button>
    <button type="button" data-action="print" title="Imprimir / salvar PDF (Ctrl+P)">Imprimir / PDF</button>
    <span class="grow"></span>
    <span id="sync-state" role="status" aria-live="polite">Local</span>
    <span id="account"></span>
  </header>

  <nav id="tabs" role="tablist" aria-label="Abas"></nav>

  <form id="findbar" hidden>
    <input id="find-term" type="search" placeholder="Localizar" aria-label="Localizar" autocomplete="off">
    <input id="find-repl" type="text" placeholder="Substituir por" aria-label="Substituir por" autocomplete="off">
    <label><input id="find-case" type="checkbox"> Aa</label>
    <button type="button" data-find="prev">&lt;</button>
    <button type="button" data-find="next">&gt;</button>
    <button type="button" data-find="replace-all">Substituir tudo</button>
    <span id="find-count" role="status"></span>
    <button type="button" data-find="close" aria-label="Fechar">×</button>
  </form>

  <noscript><p style="padding:24px">O Notepad é um editor de texto online e precisa de JavaScript. Ative-o no navegador. <a href="sobre.html">Saiba mais</a>.</p></noscript>

  <main id="work">
    <div id="editor">
      <div id="gutter" aria-hidden="true"></div>
      <textarea id="text" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de texto"></textarea>
    </div>
    <article id="preview" hidden aria-label="Preview de Markdown"></article>
  </main>

  <footer id="status">
    <span id="st-pos">Ln 1, Col 1</span>
    <span id="st-size"></span>
    <span>UTF-8</span>
    <span id="st-warn"></span>
    <span class="grow"></span>
    <nav aria-label="Sobre o Notepad"><a href="sobre.html">Sobre</a> · <a href="privacidade.html">Privacidade</a></nav>
  </footer>

  <div id="toast" role="status" hidden></div>

  <dialog id="dlg-files">
    <form method="dialog">
      <h2>Abrir do Drive</h2>
      <ul id="file-list"></ul>
      <p id="file-empty" hidden>Nenhum arquivo na pasta "Notepad".</p>
      <menu><button value="cancel">Fechar</button></menu>
    </form>
  </dialog>

  <dialog id="dlg-conflict">
    <form method="dialog">
      <h2>Conflito de sincronização</h2>
      <p>O workspace no Drive é diferente do que está neste navegador. O que deseja manter?</p>
      <menu>
        <button value="local">Manter local</button>
        <button value="remote">Manter do Drive</button>
        <button value="copy">Manter os dois</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
